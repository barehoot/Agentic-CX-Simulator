[project]
name = "agentic-cx-simulator"
version = "1.0.0"
description = "Agentic CX Simulator for OpenEnv Hackathon"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.1",
    "pydantic>=2.6.4",
    "pyyaml>=6.0.1",
    "openai>=1.14.0",
    "requests>=2.31.0",
    "openenv-core>=0.2.0"   # <-- Fixes the missing dependency error
]

[project.scripts]
server = "server.app:main"uv lock